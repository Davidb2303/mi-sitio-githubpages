<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Página</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    header {
      background-color: #333;
      color: white;
      width: 100%;
      padding: 20px 0;
    }

    main {
      padding: 40px;
      max-width: 600px;
    }

    h1 {
      margin: 0;
    }

    p {
      color: #555;
      line-height: 1.6;
    }

    footer {
      margin-top: auto;
      padding: 15px;
      font-size: 0.9em;
      color: #888;
    }
  </style>
</head>
<body>

  <header>
    <h1>Bienvenido a mi página</h1>
  </header>

  <main>
    <p>Esta es una página web sencilla, publicada con GitHub Pages.</p>
    <p>Puedes editar este contenido como quieras.</p>
  </main>

  <footer>
    <p>&copy; 2026 Mi Sitio Web</p>
  </footer>

</body>
</html>
